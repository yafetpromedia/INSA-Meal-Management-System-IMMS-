services:
  postgres:
    image: postgres:16-alpine
    container_name: imms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imms
      POSTGRES_PASSWORD: imms_dev_password
      POSTGRES_DB: imms
    ports:
      - "5432:5432"
    volumes:
      - imms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imms -d imms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imms_pg_data:
